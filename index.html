<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>하이스쿨 아두이노 RC카 조종기</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-1@1.1/Giants-Regular.woff2">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Pretendard:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: '자이언츠 Regular';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2307-1@1.1/Giants-Regular.woff2') format('woff2');
    font-weight: normal;
  }

  :root {
    --red: #FF0000;
    --black: #000000;
    --gray: #666666;
    --soft: #F4F6F8;
    --line: #CCCCCC;
    --font-giant: '자이언츠 Regular', 'Pretendard', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #FFFFFF; color: var(--black);
    font-family: var(--font-giant);
  }

  /* 세로 화면 시 가로 회전 안내 */
  #rotate-guide {
    position: fixed; inset: 0; z-index: 9999;
    background: #FFFFFF; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 20px;
  }
  @media (orientation: landscape) {
    #rotate-guide { display: none !important; }
  }

  /* 전체 뷰포트 센터링 래퍼 */
  #viewport-wrapper {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #FFFFFF;
  }

  /* 가상 콕핏 컨테이너 (820px * 370px 기준 해상도 -> 화면에 100% 자동 스케일링) */
  #cockpit {
    width: 820px;
    height: 370px;
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr) 240px;
    gap: 16px;
    padding: 12px 18px;
    box-sizing: border-box;
    background: #FFFFFF;
    position: relative;
  }

  /* 좌측: 스티어링 휠 */
  .left-zone {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
  }
  .wheel-wrap {
    width: 200px;
    height: 200px;
    position: relative;
    cursor: grab;
    touch-action: none;
    transition: transform 0.08s ease-out;
  }
  .wheel-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .wheel-wrap:active { cursor: grabbing; }

  /* 중앙: 대시보드 HUD */
  .center-zone {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: 100%;
    padding: 4px 0;
  }
  .top-hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    white-space: nowrap;
    gap: 8px;
    box-sizing: border-box;
    flex-wrap: wrap;          /* 좁으면 연결 칸을 둘째 줄로 */
    justify-content: center;
    row-gap: 6px;
  }
  .hud-conn { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .brand-logo {
    display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: bold; flex-shrink: 0;
  }
  .brand-logo span.red { color: var(--red); }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--gray); flex-shrink: 0;
  }
  .status-badge::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--red);
  }
  .status-badge.on::before {
    background: #2E7D32; box-shadow: 0 0 6px #2E7D32;
  }
  .btn-connect {
    background: var(--red); color: #FFF; border: none; border-radius: 5px;
    padding: 5px 12px; font-family: var(--font-giant); font-size: 11px; font-weight: bold; cursor: pointer; flex-shrink: 0;
  }
  .btn-connect.on { background: #333333; }
  .pw-input {
    width: 58px; height: 30px; flex-shrink: 0; text-align: center; font: 700 14px 'JetBrains Mono', monospace;
    letter-spacing: 2px; border: 2px solid var(--black); border-radius: 8px; padding: 0 4px; user-select: text; -webkit-user-select: text;
  }
  .pw-input.bad { border-color: var(--red); animation: pwShake .3s; }
  @keyframes pwShake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* 중앙 기어 게이지 */
  .gear-gauge {
    display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0;
    width: 100%;
  }
  .gear-display-row {
    display: flex; align-items: baseline; gap: 6px;
  }
  .gear-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 56px;
    font-weight: 800;
    line-height: 1; color: var(--black);
  }
  .gear-unit {
    font-size: 20px;
    font-weight: 800;
    color: var(--red);
  }
  .gear-label { font-size: 11px; font-weight: bold; color: var(--gray); letter-spacing: 0.5px; margin-top: 2px; }
  
  /* 5단 기어 스틱 (실제 H 패턴 게이트) */
  .gear-row { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
  .shifter {
    position: relative; width: 210px; height: 132px; flex-shrink: 0;
    background: linear-gradient(#2B2F36, #1A1D22); border-radius: 14px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.15);
    touch-action: none;
  }
  .shifter svg.gate { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .gear-btn {
    position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: none; background: transparent;
    border-radius: 50%; cursor: pointer; padding: 0; z-index: 3;
    font-family: 'JetBrains Mono', var(--font-giant); font-size: 13px; font-weight: 800; color: #9AA3AE;
  }
  .gear-btn span { position: absolute; left: 50%; transform: translateX(-50%); }
  .gear-btn.top span { top: -12px; }
  .gear-btn.bot span { bottom: -12px; }
  .gear-btn.active span { color: #FFFFFF; }
  .gear-btn.active.gear-max span { color: var(--red); }
  .knob {
    position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #6B6F76 0%, #22252A 45%, #050607 100%);
    border: 3px solid var(--red); box-shadow: 0 4px 8px rgba(0,0,0,.55);
    transition: left .16s ease-out, top .16s ease-out;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: #FFF;
  }

  .btn-stop {
    width: 100%; padding: 8px 14px; border-radius: 8px;
    border: 2px solid var(--red); background: #FFF;
    color: var(--red); font-family: var(--font-giant); font-size: 13px; font-weight: bold; cursor: pointer;
    transition: all 0.15s; margin-top: auto;
  }
  .btn-stop:active { background: var(--red); color: #FFF; }

  /* 우측: 시동 버튼 + 페달 */
  .right-zone {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    height: 100%;
    padding: 4px 0;
    box-sizing: border-box;
  }

  /* 시동 버튼 (가로형 직사각형 카드) */
  .btn-engine-card {
    width: 100%;
    height: 42px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    cursor: pointer;
    touch-action: manipulation;
    border: 2px solid #000000;
    background: var(--soft);
    box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    transition: all 0.12s;
    font-family: var(--font-giant);
    user-select: none;
    box-sizing: border-box;
  }
  .btn-engine-card .eng-left {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: bold;
    color: #000000;
  }
  .btn-engine-card .eng-badge {
    font-size: 11px;
    font-weight: bold;
    padding: 2px 7px;
    border-radius: 4px;
    background: #000000;
    color: #FFFFFF;
  }
  .btn-engine-card .eng-deco {
    display: flex;
    gap: 3px;
  }
  .btn-engine-card .eng-deco span {
    width: 3px;
    height: 13px;
    background: #CCCCCC;
    border-radius: 1px;
  }
  .btn-engine-card:active {
    transform: scale(0.98);
    background: #EAEAEA;
  }

  /* 시동 꺼짐 상태 */
  .btn-engine-card.engine-off {
    background: #FFF5F5;
    border-color: var(--red);
  }
  .btn-engine-card.engine-off .eng-left {
    color: var(--red);
  }
  .btn-engine-card.engine-off .eng-badge {
    background: var(--red);
    color: #FFFFFF;
  }
  .btn-engine-card.engine-off .eng-deco span {
    background: #FFCDD2;
  }
  .btn-engine-card.engine-off:active {
    background: #FFEBEE;
  }

  .pedals-container {
    display: flex;
    gap: 10px;
    width: 100%;
    height: 170px;
    box-sizing: border-box;
  }
  .pedal {
    flex: 1; height: 100%; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; padding: 10px 6px;
    cursor: pointer; touch-action: none; border: 2px solid var(--line);
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    transition: all 0.1s; font-family: var(--font-giant);
    box-sizing: border-box;
  }
  /* 브레이크 페달 */
  .pedal.brake { background: #FFF5F5; border-color: var(--red); }
  .pedal.brake .p-name { color: var(--red); font-size: 11px; font-weight: bold; }
  .pedal.brake .p-icon { font-size: 20px; color: var(--red); line-height: 1; }
  .pedal.brake:active, .pedal.brake.active {
    background: var(--red); color: #FFF !important;
  }
  .pedal.brake:active *, .pedal.brake.active * { color: #FFF !important; }

  /* 엑셀 페달 */
  .pedal.gas { background: var(--soft); border-color: #000; }
  .pedal.gas .p-name { color: #000; font-size: 11px; font-weight: bold; }
  .pedal.gas .p-icon { font-size: 20px; color: #000; line-height: 1; }
  .pedal.gas:active, .pedal.gas.active {
    background: #000; color: #FFF !important;
  }
  .pedal.gas:active *, .pedal.gas.active * { color: #FFF !important; }

  .pedal-lines {
    width: 60%; height: 28px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .pedal-lines div { width: 100%; height: 3px; background: #CCCCCC; border-radius: 1.5px; }
</style>
</head>

  <script>
    // 화면 크기에 맞춘 100% 자동 스케일러 (가상 해상도 820 x 370)
    function autoFit() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const targetW = 820;
      const targetH = 370;
      const scale = Math.min(w / targetW, h / targetH, 1.4);
      const cockpit = document.getElementById('cockpit');
      if (cockpit) {
        cockpit.style.transform = `scale(${scale})`;
        cockpit.style.transformOrigin = 'center center';
      }
    }
    window.addEventListener('resize', autoFit);
    window.addEventListener('orientationchange', () => setTimeout(autoFit, 150));
    document.addEventListener('DOMContentLoaded', autoFit);
    setTimeout(autoFit, 50);

    const SERVICE_UUID = 0xffe0;
    // 검색 목록에 띄울 기기: 우리 차 이름 + HM-10/BT05 계열 모듈
    const CAR_FILTERS = ['CAR', 'speedstar', 'ledtest', 'BT05', 'MLT-BT05', 'HMSoft', 'HM-10', 'JDY'].map(p => ({ namePrefix: p }))
      .concat([{ services: [SERVICE_UUID] }]);
    let showAll = false;
    const CHAR_UUID = 0xffe1;
    const RESEND_MS = 150;

    let device = null, ch = null, resendTimer = null, isBusy = false, pendingCmd = null;
    // ★ 보안: 아두이노가 비번을 확인해야(AUTH OK) 조종 명령을 보냄
    let authed = false, carPw = '', rxBuf = '', authTimer = null;
    const pwInput = document.getElementById('pw-input');

    let isGas = false, isBrake = false;
    let currentSteer = 'CENTER';
    let isEngineOn = true;
    let currentGear = 1; // 기본값: 1단 (PWM 223)

    const wheel = document.getElementById('steering-wheel');
    const statusBadge = document.getElementById('status-badge');
    const btnConnect = document.getElementById('btn-connect');
    const hudGear = document.getElementById('hud-gear');
    const gearBtns = document.querySelectorAll('.gear-btn');
    const btnStop = document.getElementById('btn-stop');

    const pedalGas = document.getElementById('pedal-gas');
    const pedalBrake = document.getElementById('pedal-brake');
    const btnEngine = document.getElementById('btn-engine');
    const engIcon = document.getElementById('eng-icon');
    const engTitle = document.getElementById('eng-title');
    const engBadge = document.getElementById('eng-badge');

    // 기어 스틱 위치 (H 패턴 게이트 좌표)
    const GEAR_POS = { 1: [40, 32], 2: [40, 100], 3: [105, 32], 4: [105, 100], 5: [170, 32] };
    const gearKnob = document.getElementById('gear-knob');
    const gearShaft = document.getElementById('gear-shaft');
    function moveStick(g) {
      const [x, y] = GEAR_POS[g];
      gearKnob.style.left = x + 'px';
      gearKnob.style.top = y + 'px';
      gearKnob.textContent = g;
      gearShaft.setAttribute('x2', x);
      gearShaft.setAttribute('y2', y);
    }

    // 기어 변경 함수 (1 ~ 5단)
    function setGear(g) {
      currentGear = Math.max(1, Math.min(5, parseInt(g, 10) || 1));
      hudGear.textContent = currentGear;
      moveStick(currentGear);
      
      gearBtns.forEach(btn => {
        const val = parseInt(btn.dataset.gear, 10);
        if (val === currentGear) {
          btn.classList.add('active');
          if (val === 5) btn.classList.add('gear-max');
        } else {
          btn.classList.remove('active', 'gear-max');
        }
      });

      // 아두이노로 '1' ~ '5' 기어 명령 전송
      sendCommand(String(currentGear));
      if (navigator.vibrate) navigator.vibrate(25);
    }

    // 기어 스틱: 탭 또는 손으로 끌어서 가장 가까운 단으로 이동
    const shifter = document.getElementById('gear-selector');
    function gearAt(e) {
      const rc = shifter.getBoundingClientRect();
      const x = (e.clientX - rc.left) * 210 / rc.width, y = (e.clientY - rc.top) * 132 / rc.height;
      let best = 1, bd = Infinity;
      for (const g in GEAR_POS) {
        const d = (GEAR_POS[g][0] - x) ** 2 + (GEAR_POS[g][1] - y) ** 2;
        if (d < bd) { bd = d; best = +g; }
      }
      return best;
    }
    shifter.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      shifter.setPointerCapture(e.pointerId);
      const g = gearAt(e);
      if (g !== currentGear) setGear(g);
    });
    shifter.addEventListener('pointermove', e => {
      if (!shifter.hasPointerCapture(e.pointerId)) return;
      const g = gearAt(e);
      if (g !== currentGear) setGear(g);
    });

    // 엔진 시동 버튼 토글 이벤트
    function toggleEngine(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      isEngineOn = !isEngineOn;
      if (isEngineOn) {
        btnEngine.classList.remove('engine-off');
        engIcon.textContent = '⚡';
        engTitle.textContent = 'ENGINE START';
        engBadge.textContent = '시동 ON';
        if (navigator.vibrate) navigator.vibrate([40, 30, 80]);
        // 시동 ON 시 현재 기어값 유지 및 재동기화
        sendCommand(String(currentGear));
      } else {
        btnEngine.classList.add('engine-off');
        engIcon.textContent = '⭕';
        engTitle.textContent = 'ENGINE STOP';
        engBadge.textContent = '시동 OFF';
        if (navigator.vibrate) navigator.vibrate(60);
        // 시동 OFF 시 차량 즉시 정지 신호만 전송, 기어값은 현재값 그대로 안전하게 유지!
        sendCommand('S');
      }
      hudGear.textContent = currentGear; // 기어 표시 절대 오염 방지
      updateDrive();
    }

    btnEngine.addEventListener('pointerdown', toggleEngine);

    function getCommand() {
      if (!isEngineOn) return 'S';
      if (isGas) {
        if (currentSteer === 'LEFT') return 'G';  // 전진 좌회전
        if (currentSteer === 'RIGHT') return 'I'; // 전진 우회전
        return 'F';                             // 전진
      }
      if (isBrake) {
        if (currentSteer === 'LEFT') return 'H';  // 후진 좌회전
        if (currentSteer === 'RIGHT') return 'J'; // 후진 우회전
        return 'B';                             // 후진
      }
      return 'S';                               // 페달 없으면 정지 (핸들은 방향만 정함)
    }

    async function sendCommand(cmd) {
      if (!ch || !cmd || !authed) return;
      if (isBusy) { pendingCmd = cmd; return; }
      isBusy = true;
      try {
        const data = new TextEncoder().encode(cmd);
        if (ch.properties.writeWithoutResponse) await ch.writeValueWithoutResponse(data);
        else await ch.writeValue(data);
      } catch (e) { }
      isBusy = false;
      if (pendingCmd) {
        const next = pendingCmd; pendingCmd = null;
        sendCommand(next);
      }
    }

    function updateDrive() {
      const cmd = getCommand();
      clearInterval(resendTimer);
      if (cmd && cmd !== 'S') {
        sendCommand(cmd);
        resendTimer = setInterval(() => sendCommand(getCommand()), RESEND_MS);
      } else {
        sendCommand('S');
      }
    }

    let isDragging = false;
    function handleSteerMove(clientX) {
      const rect = wheel.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const diffX = clientX - centerX;

      if (diffX < -30) {
        currentSteer = 'LEFT';
        wheel.style.transform = 'rotate(-38deg)';
      } else if (diffX > 30) {
        currentSteer = 'RIGHT';
        wheel.style.transform = 'rotate(38deg)';
      } else {
        currentSteer = 'CENTER';
        wheel.style.transform = 'rotate(0deg)';
      }
      updateDrive();
    }

    function resetWheel() {
      isDragging = false;
      currentSteer = 'CENTER';
      wheel.style.transform = 'rotate(0deg)';
      updateDrive();
    }

    wheel.addEventListener('pointerdown', e => {
      e.preventDefault();
      isDragging = true;
      wheel.setPointerCapture(e.pointerId);
      handleSteerMove(e.clientX);
    });
    wheel.addEventListener('pointermove', e => {
      if (!isDragging) return;
      handleSteerMove(e.clientX);
    });
    wheel.addEventListener('pointerup', resetWheel);
    wheel.addEventListener('pointercancel', resetWheel);

    function bindPedal(el, onDown, onUp) {
      el.addEventListener('pointerdown', e => {
        e.preventDefault();
        el.setPointerCapture(e.pointerId);
        el.classList.add('active');
        onDown();
        updateDrive();
      });
      const end = () => {
        el.classList.remove('active');
        onUp();
        updateDrive();
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
    }

    bindPedal(pedalGas, () => { isGas = true; isBrake = false; pedalBrake.classList.remove('active'); }, () => { isGas = false; });
    bindPedal(pedalBrake, () => { isBrake = true; isGas = false; pedalGas.classList.remove('active'); }, () => { isBrake = false; });

    btnStop.addEventListener('pointerdown', e => {
      e.preventDefault();
      isGas = isBrake = false;
      resetWheel();
      document.querySelectorAll('.active').forEach(b => b.classList.remove('active'));
      sendCommand('S');
      if (navigator.vibrate) navigator.vibrate(50);
    });

    // 비번 전송: "P1234\n" → 아두이노가 AUTH OK / AUTH FAIL 응답
    async function sendAuth() {
      if (!ch) return;
      statusBadge.textContent = '비번 확인 중...';
      try {
        const data = new TextEncoder().encode('P' + carPw + '\n');
        if (ch.properties.writeWithoutResponse) await ch.writeValueWithoutResponse(data);
        else await ch.writeValue(data);
      } catch (e) { }
      clearTimeout(authTimer);
      authTimer = setTimeout(() => {
        statusBadge.textContent = '응답 없음 (배선·코드 확인)';
        statusBadge.classList.remove('on');
      }, 1500);
    }

    // 아두이노 응답 처리 (줄 단위)
    function onRx(text) {
      rxBuf += text;
      let i;
      while ((i = rxBuf.indexOf('\n')) >= 0) {
        const msg = rxBuf.slice(0, i).trim();
        rxBuf = rxBuf.slice(i + 1);
        if (msg === 'AUTH OK') {
          clearTimeout(authTimer);
          const first = !authed;
          authed = true;
          statusBadge.textContent = (device.name || 'RC카') + ' 연결됨';
          statusBadge.classList.add('on');
          if (first) sendCommand(String(currentGear)); // 연결 시 현재 기어 동기화
          updateDrive();
        } else if (msg === 'AUTH FAIL') {
          clearTimeout(authTimer);
          authed = false;
          statusBadge.textContent = '비번 틀림';
          statusBadge.classList.remove('on');
          pwInput.classList.remove('bad'); void pwInput.offsetWidth; pwInput.classList.add('bad');
          device.gatt.disconnect();
        } else if (msg === 'LOCKED') {
          // 30초 방치로 아두이노가 다시 잠금 → 저장된 비번으로 자동 재인증
          authed = false;
          sendAuth();
        }
      }
    }

    btnConnect.addEventListener('click', async () => {
      if (device && device.gatt.connected) {
        device.gatt.disconnect();
        return;
      }
      // ★ 비번 4자리를 넣어야 연결 시작
      carPw = pwInput.value.normalize('NFKC').replace(/\D/g, '');
      if (carPw.length !== 4) {
        pwInput.classList.remove('bad'); void pwInput.offsetWidth; pwInput.classList.add('bad');
        statusBadge.textContent = '비번 4자리 입력';
        return;
      }
      pwInput.classList.remove('bad');
      if (!navigator.bluetooth) {
        alert('안드로이드는 Chrome, 아이폰은 Bluefy 앱으로 열어주세요.');
        return;
      }
      try {
        statusBadge.textContent = '장치 검색 중...';
        // 기본: 우리 차 이름(CAR·speedstar 등)·BLE 모듈만 표시 → 알 수 없는 기기 숨김
        // 목록에 없어서 취소하면 다음 번 누를 때 전체 기기 표시
        const opts = showAll
          ? { acceptAllDevices: true, optionalServices: [SERVICE_UUID] }
          : { filters: CAR_FILTERS, optionalServices: [SERVICE_UUID] };
        device = await navigator.bluetooth.requestDevice(opts);
        showAll = false;

        statusBadge.textContent = '연결 시도 중...';
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        ch = await service.getCharacteristic(CHAR_UUID);
        await ch.startNotifications();
        ch.addEventListener('characteristicvaluechanged', e => onRx(new TextDecoder().decode(e.target.value)));

        btnConnect.textContent = '연결 해제';
        btnConnect.classList.add('on');

        device.addEventListener('gattserverdisconnected', () => {
          statusBadge.textContent = '연결 끊김';
          statusBadge.classList.remove('on');
          btnConnect.textContent = '차량 연결';
          btnConnect.classList.remove('on');
          ch = null; authed = false;
          clearInterval(resendTimer); clearTimeout(authTimer);
        });

        setTimeout(sendAuth, 300);
      } catch (e) {
        statusBadge.classList.remove('on');
        btnConnect.classList.remove('on');
        if (e.name === 'NotFoundError' && !showAll) {
          showAll = true;
          statusBadge.textContent = '목록에 없으면 다시 눌러 전체 보기';
          btnConnect.textContent = '전체 보기';
        } else {
          showAll = false;
          statusBadge.textContent = '연결 실패';
          btnConnect.textContent = '차량 연결';
        }
      }
    });
  </script>
</body>
</html>
