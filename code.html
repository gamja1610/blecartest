<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rc_car.ino 전체 코드</title>
<style>
  body { margin: 0; background: #fff; color: #111; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; }
  h1 { margin: 0; font-size: 18px; }
  button { border: none; border-radius: 8px; padding: 10px 16px; background: #E53935; color: #fff; font-size: 16px; font-weight: 700; }
  pre { margin: 0; padding: 16px; font: 13px/1.45 Consolas, "D2Coding", monospace; white-space: pre; overflow-x: auto; background: #f6f7f8; }
</style>
</head>
<body>
<header>
  <h1>rc_car.ino 전체 코드</h1>
  <button id="copy">전체 복사</button>
</header>
<pre id="code">불러오는 중...</pre>
<script>
  // 저장소의 arduino/rc_car/rc_car.ino를 그대로 보여줌 → 저장소 파일을 고치면 이 페이지도 같이 바뀜
  const SRC = 'arduino/rc_car/rc_car.ino';
  const pre = document.getElementById('code');
  const btn = document.getElementById('copy');
  fetch(SRC + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => { pre.textContent = t; })
    .catch(() => { pre.textContent = '코드를 불러오지 못했습니다. 새로고침 해주세요.'; });
  btn.onclick = async () => {
    const t = pre.textContent;
    try { await navigator.clipboard.writeText(t); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    btn.textContent = '복사 완료!';
    setTimeout(() => { btn.textContent = '전체 복사'; }, 1500);
  };
</script>
</body>
</html>
